<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="한마음선원 안양 본원의 주요 공간을 둘러보는 게임형 도량 탐방 시안">
<title>안양 본원 도량 탐방 · 한마음선원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/deungbul/anyangMap.css">
</head>
<body>
<canvas id="game" tabindex="0" aria-label="안양 본원 도량. 방향키 또는 WASD로 이동하고 Space로 장소를 살펴봅니다.">도량 탐방은 캔버스를 지원하는 브라우저에서 이용할 수 있습니다.</canvas>

<div id="hud">
  <h3 id="hudh" role="button" tabindex="0" aria-expanded="true" aria-controls="hudbody">안양 본원 도량 <small>접기</small></h3>
  <div id="hudbody">
    <p class="lead">공식 조감도의 상대 배치를 참고한 게임용 축척입니다. 실측 위치·거리·실제 출입 동선이 아닙니다.</p>
    <p class="count" id="count">둘러본 곳 0 / 0</p>
    <p class="status" id="status" role="status">도량을 천천히 둘러보세요.</p>
    <div class="here" id="here"></div>
  </div>
</div>

<div id="topbtns">
  <a class="iconbtn" id="backb" href="/deungbul.html?from=doryang" aria-label="등불사장으로 돌아가기" title="등불사장으로">🏮</a>
  <button class="iconbtn" id="nightb" aria-label="나만 밤 풍경" aria-pressed="false" title="밤 풍경">🌙</button>
  <button class="iconbtn" id="helpb" aria-label="도움말 열기" title="도움말">?</button>
</div>

<div id="modal"><div class="card" id="card" role="dialog" aria-modal="true" aria-label="안내" tabindex="-1"></div></div>
<div id="fade" aria-hidden="true"></div>
<div id="joy"><i></i></div>
<button id="act">살펴보기</button>
<button id="listb" aria-haspopup="dialog">둘러볼 곳</button>
<script type="module" src="/src/deungbul/anyangMap.js"></script>
</body>
</html>
