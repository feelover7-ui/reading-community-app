# 예시입니다. 실제 계정 id·토큰·도메인은 커밋하지 않습니다.
# 쓰는 사람이 wrangler.toml 로 복사해 값을 채웁니다.
name = "lantern-room"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "LANTERN_ROOM"
class_name = "LanternRoom"

# SQLite 기반 DO. 무료 플랜에서 쓰려면 SQLite 클래스여야 합니다.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LanternRoom"]

[env.staging]
name = "lantern-room-staging"

# durable_objects 는 환경에 상속되지 않습니다. 환경마다 다시 적어야 합니다.
[[env.staging.durable_objects.bindings]]
name = "LANTERN_ROOM"
class_name = "LanternRoom"

[env.staging.vars]
# 쉼표로 구분한 정확한 출처만 적습니다. 와일드카드는 쓰지 않습니다.
ALLOWED_ORIGINS = "https://goal-windows-codex-mvp-node-js-2.vercel.app,http://localhost:5173"
