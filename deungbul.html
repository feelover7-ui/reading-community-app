<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한마음선원 등불사장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1d14;--paper:#fbf4e4;--accent:#c8402f;--gold:#d9a531;--line:#d8c6a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b140f;font-family:'Noto Sans KR',sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas#game{display:block}
#hud{position:fixed;left:12px;top:12px;width:262px;padding:12px 14px;background:rgba(251,244,228,.95);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.25);font-size:13px;z-index:5}
#hud h3{margin:0 0 6px;font-family:'Gowun Batang',serif;font-size:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
#hud h3 small{font-family:'Noto Sans KR';font-size:11px;color:#9a8a76;font-weight:400}
#hud ol{margin:0;padding:0;list-style:none}
#hud li{padding:3px 0;color:#8a7a66;display:flex;gap:7px;line-height:1.4}
#hud li b{width:16px;flex:none;text-align:center}
#hud li.done{color:#a89880;text-decoration:line-through}
#hud li.cur{color:var(--ink);font-weight:700}
#hud .foot{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);color:#6b5a48;font-size:12px}
#hud.collapsed ol,#hud.collapsed .foot{display:none}
#hud.collapsed h3{margin:0}
#topbtns{position:fixed;right:12px;top:12px;display:flex;gap:8px;z-index:5}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(251,244,228,.95);font-size:17px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#dialog{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(660px,calc(100vw - 24px));background:var(--paper);border:2px solid #6b4a2f;border-radius:14px;padding:20px 20px 16px;display:none;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:10}
#dialog .name{position:absolute;top:-15px;left:18px;background:#6b4a2f;color:#fbf4e4;padding:4px 14px;border-radius:999px;font-size:13px;font-weight:700}
#dialog .text{font-size:16px;line-height:1.65;min-height:2.6em;white-space:pre-wrap}
#dialog .next{position:absolute;right:14px;bottom:8px;font-size:12px;color:#9a8a76}
#modal{position:fixed;inset:0;background:rgba(20,12,6,.6);display:none;align-items:center;justify-content:center;z-index:20;touch-action:auto}
#modal.show{display:flex}
.card{background:var(--paper);border-radius:16px;width:min(540px,calc(100vw - 20px));max-height:calc(100% - 20px);overflow:auto;padding:20px 20px 18px;position:relative;border:2px solid #6b4a2f;user-select:text;-webkit-user-select:text}
.card h2{font-family:'Gowun Batang',serif;margin:0 0 4px;font-size:22px}
.card .sub{margin:0 0 12px;color:#6b5a48;font-size:14px;line-height:1.5}
.card .x{position:absolute;right:8px;top:8px;border:none;background:none;font-size:20px;cursor:pointer;color:#6b5a48;width:40px;height:40px}
.pv{display:flex;justify-content:center;margin:4px 0 12px;background:#f1e3c4;border-radius:12px;padding:8px;transition:background .8s}
.pv.dark{background:#1d1830}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:12px}
.opt{border:2px solid #e2d3b4;background:#fffaf0;border-radius:10px;padding:7px 4px;cursor:pointer;font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink)}
.opt.sel{border-color:var(--accent);background:#fff0e6;font-weight:700}
.opt:disabled{opacity:.4;cursor:default}
.sw{width:38px;height:38px;border-radius:50%;border:1px solid rgba(0,0,0,.15);box-shadow:inset 0 -6px 10px rgba(0,0,0,.08)}
.bar{height:10px;background:#eadcc0;border-radius:999px;overflow:hidden;margin:2px 0 12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0913a,#c8402f);transition:width .2s}
.btn{width:100%;padding:14px;border:none;border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#cdbfa6;cursor:default;transform:none}
.btn.ghost{background:#eadcc0;color:var(--ink);margin-top:8px}
.card label{display:block;font-size:13px;color:#6b5a48;margin:4px 0 6px}
.card textarea{width:100%;border:2px solid #e2d3b4;border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;resize:none;background:#fffaf0;margin-bottom:10px;font-family:'Gowun Batang',serif}
.card input{width:100%;border:2px solid #e2d3b4;border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:#fffaf0;margin-bottom:8px;color:var(--ink)}
.card .row{display:flex;gap:8px;align-items:flex-start}
.card .row input{margin-bottom:0}
.card .row .btn{width:auto;flex:none;padding:12px 18px;font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:9px 4px;border:2px solid #e2d3b4;background:#fffaf0;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;color:#6b5a48}
.tab.sel{border-color:var(--accent);background:#fff0e6;color:var(--ink);font-weight:700}
.blist{height:40vh;min-height:170px;overflow:auto;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:#fffaf0;padding:8px}
.blist .empty{color:#9a8a76;font-size:13px;text-align:center;padding:26px 8px;line-height:1.6}
.post{padding:8px 2px;border-bottom:1px dashed var(--line)}
.post:last-child{border-bottom:none}
.post .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:#9a8a76;margin-bottom:3px}
.post .meta b{color:#6b4a2f;font-size:13px}
.post .meta .sp{flex:1}
.post .body{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.post .delrow{display:flex;gap:6px;margin-top:6px}
.post .delrow input{margin-bottom:0;padding:7px 10px;font-size:14px}
.linkbtn{border:none;background:none;color:#9a8a76;font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:2px 4px}
.linkbtn.warn{color:var(--accent)}
.msg{padding:4px 2px;font-size:14px;line-height:1.5;word-break:break-word}
.msg b{color:#6b4a2f;margin-right:6px}
.msg .t{color:#b5a68f;font-size:11px;margin-left:6px}
.msg.mine b{color:var(--accent)}
.note{font-size:12px;color:#9a8a76;line-height:1.5;margin:0 0 8px}
.card .help p{margin:0 0 8px;font-size:14px;line-height:1.6}
.card .help kbd{background:#eadcc0;border-radius:5px;padding:1px 7px;font-size:12px;font-family:inherit}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-90px);background:#2b1d14;color:#fbf4e4;padding:10px 18px;border-radius:999px;font-size:14px;transition:transform .35s;z-index:30;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#toast.show{transform:translate(-50%,0)}
#joy{position:fixed;left:22px;bottom:26px;width:132px;height:132px;border-radius:50%;background:rgba(251,244,228,.18);border:2px solid rgba(251,244,228,.5);display:none;z-index:6}
#joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(251,244,228,.85);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#act{position:fixed;right:24px;bottom:40px;width:86px;height:86px;border-radius:50%;background:rgba(200,64,47,.92);color:#fff;font:700 15px 'Noto Sans KR',sans-serif;border:3px solid rgba(255,255,255,.65);display:none;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.35)}
body.touch #joy,body.touch #act{display:block}
#title{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 38%,#4a2c18 0%,#1a110a 72%);color:#fbf4e4;text-align:center;padding:24px;transition:opacity .6s}
#title.hide{opacity:0;pointer-events:none}
#title .kicker{letter-spacing:.3em;font-size:13px;color:#e8c45a;margin-bottom:6px}
#title h1{font-family:'Gowun Batang',serif;font-size:clamp(44px,9vw,76px);margin:0 0 6px;letter-spacing:.08em;text-shadow:0 0 30px rgba(255,170,80,.45)}
#title p{max-width:440px;margin:0 auto 18px;line-height:1.7;color:#e9dcc4;font-size:15px}
#title canvas{display:block;margin:0 auto 16px}
#title button{background:#c8402f;color:#fff;border:none;border-radius:999px;padding:14px 40px;font:700 17px 'Noto Sans KR';cursor:pointer;box-shadow:0 0 24px rgba(255,140,60,.45)}
#title .ctl{margin-top:16px;font-size:12px;color:#b8a78c}
@media (max-width:640px){#hud{width:206px;font-size:12px;padding:10px 12px}#hud h3{font-size:14px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud"><h3 id="hudh">오늘의 소임 <small>접기</small></h3><ol id="quest"></ol><div class="foot" id="hudfoot"></div></div>
<div id="topbtns"><button class="iconbtn" id="snd" title="소리">🔊</button><button class="iconbtn" id="helpb" title="도움말">?</button></div>
<div id="dialog"><div class="name" id="dname"></div><div class="text" id="dtext"></div><div class="next">▼ 계속</div></div>
<div id="modal"><div class="card" id="card"></div></div>
<div id="toast"></div>
<div id="joy"><i></i></div>
<button id="act">작업</button>

<div id="title">
  <div>
    <div class="kicker">한마음선원 청년회</div>
    <h1>등불사장</h1>
    <canvas id="tcv" width="320" height="110"></canvas>
    <p>장엄등을 만드는 등불사장에서<br>나만의 소원등을 엮고, 바르고, 칠하고, 밝혀서<br>마당에 걸고 다 함께 점등해요.</p>
    <button id="startb">들어가기</button>
    <div class="ctl" id="ctlhint">이동 방향키 · WASD &nbsp;|&nbsp; 작업·대화 Space</div>
  </div>
</div>

<script type="module" src="/src/deungbul/game.js"></script>
</body>
</html>
