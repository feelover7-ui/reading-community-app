<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한마음선원 등불사장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#30251c;--muted:#71624e;--paper:#fff9ec;--paper-deep:#f1e5cd;
  --accent:#b83e2d;--gold:#d4ac5a;--line:#d9c8a5;--wood:#61472f;
  --shadow:0 12px 36px rgba(30,18,9,.22)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#21180f;color:var(--ink);font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
input,textarea{user-select:text;-webkit-user-select:text}
:focus-visible{outline:3px solid #286788;outline-offset:4px}
canvas#game{display:block;touch-action:none}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:272px;max-height:calc(100dvh - 24px);overflow-y:auto;touch-action:pan-y pinch-zoom;padding:14px;background:rgba(255,249,236,.97);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:16px;box-shadow:var(--shadow);font-size:13px;z-index:5}
#hud h3{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;margin:0 0 10px;font:700 17px 'Gowun Batang',serif;cursor:pointer}
#hud h3 small{flex:none;padding:4px 8px;border-radius:7px;background:var(--paper-deep);color:var(--muted);font:400 11px 'Noto Sans KR',sans-serif}
#hud ol{list-style:none;margin:0;padding:0;display:grid;gap:3px}
#hud li{display:flex;gap:8px;padding:7px 8px;border-radius:8px;line-height:1.5;color:var(--muted)}
#hud li b{flex:none;width:16px;text-align:center}
#hud li.cur{background:#f6e8c7;color:#763321;font-weight:700;box-shadow:inset 3px 0 var(--accent)}
#hud li.done{color:#786a55;text-decoration:line-through}
#hud .foot,#hud .here{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.65;overflow-wrap:anywhere}
#hud .here{display:none}
#hud .here b{color:var(--accent)}
#hud .here .me{font-weight:700;color:var(--ink)}
#hud.collapsed ol,#hud.collapsed .foot,#hud.collapsed .here>div+div{display:none}
#hud.collapsed h3{margin:0}
#topbtns{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:5}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:rgba(255,249,236,.97);color:var(--ink);font-size:18px;box-shadow:0 4px 14px rgba(30,18,9,.18)}
.iconbtn:hover{background:#f4e6c7}
#dialog{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(640px,calc(100vw - 24px));display:none;padding:26px 24px 30px;border:1px solid var(--gold);border-radius:18px;background:var(--paper);box-shadow:var(--shadow);cursor:pointer;z-index:10}
#dialog .name{position:absolute;top:-14px;left:20px;background:var(--wood);color:#fff6e4;padding:5px 14px;border:1px solid #8d6b42;border-radius:8px;font-size:13px;font-weight:700}
#dialog .text{font-size:16px;line-height:1.8;min-height:2.6em;white-space:pre-wrap;overflow-wrap:anywhere}
#dialog .next{position:absolute;right:18px;bottom:9px;font-size:12px;color:var(--muted)}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(24,17,12,.72);z-index:20;touch-action:auto}
#modal.show{display:flex}
.card{position:relative;width:min(560px,calc(100vw - 24px));max-height:calc(var(--visible-height,100dvh) - 24px);overflow:auto;overscroll-behavior:contain;touch-action:pan-y pinch-zoom;padding:28px 24px 24px;border:1px solid var(--gold);border-radius:22px;background:var(--paper);box-shadow:0 24px 70px rgba(12,8,4,.4);user-select:text;-webkit-user-select:text}
.card h2{margin:0 46px 8px 0;font:700 26px 'Gowun Batang',serif;line-height:1.3;overflow-wrap:anywhere}
.card h3{font:700 18px 'Gowun Batang',serif;margin:22px 0 10px}
.card .sub{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.7}
.card .x{position:absolute;right:12px;top:14px;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#f6eddc;color:var(--wood);font-size:18px}
.pv{display:flex;justify-content:center;margin:0 0 18px;padding:16px;border:1px solid #e6d6b7;border-radius:16px;background:radial-gradient(ellipse at center,#fff9e9,#eddfbf);transition:background .6s}
.pv.dark{background:#211e36;border-color:#504461}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-bottom:18px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:82px;padding:10px 4px;border:2px solid #e1d2b6;border-radius:12px;background:#fffcf5;color:var(--ink);font-size:13px}
.opt:hover:not(:disabled){border-color:#b9945c}
.opt.sel{border-color:var(--accent);background:#fbecdd;font-weight:700;box-shadow:0 0 0 2px rgba(184,62,45,.08)}
.opt.sel::after{content:'✓';position:absolute;top:4px;right:5px;color:var(--accent);font-size:12px;font-weight:700}
.opt:disabled{opacity:.45}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.15);box-shadow:inset 0 -5px 9px rgba(0,0,0,.1)}
.bar{height:8px;border-radius:99px;overflow:hidden;background:#e5d7bd;margin:0 0 18px}
.bar i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#d4a14b,var(--accent));transition:width .2s}
.btn{width:100%;min-height:48px;padding:13px 16px;border:1px solid transparent;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;line-height:1.4}
.btn:hover:not(:disabled){background:#a73425}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{background:#dfd2ba;color:#6a5b46;transform:none}
.btn.ghost{margin-top:10px;border-color:var(--line);background:#f2e7d2;color:var(--ink)}
.btn.ghost:hover{background:#e9d9ba}
.card label{display:block;margin:0 0 7px;color:var(--muted);font-size:13px;font-weight:500}
.card textarea,.card input{width:100%;min-width:0;scroll-margin:24px;border:1px solid #cbb895;border-radius:11px;padding:12px;background:#fffcf5;color:var(--ink);font-size:16px;margin-bottom:12px}
.card textarea{resize:vertical;min-height:88px;line-height:1.7;font-family:'Gowun Batang',serif}
.card textarea:focus,.card input:focus{outline:2px solid var(--gold);outline-offset:2px}
.card .row{display:flex;align-items:flex-start;gap:8px}
.card .row input{margin-bottom:0;flex:1}
.card .row .btn{width:auto;flex:none;padding:12px 16px;font-size:15px}
.tabs{display:flex;gap:4px;padding:4px;margin-bottom:14px;border:1px solid var(--line);border-radius:13px;background:#ede1c9}
.tab{flex:1;min-height:44px;padding:9px 6px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font-size:14px}
.tab.sel{border-color:#dfcda9;background:var(--paper);color:#763321;font-weight:700;box-shadow:0 2px 5px rgba(77,50,25,.08)}
.blist{height:34vh;min-height:148px;max-height:300px;overflow:auto;margin-bottom:16px;border:1px solid var(--line);border-radius:14px;background:#fffcf6;padding:10px 12px}
.blist .empty{padding:28px 12px;color:var(--muted);font-size:14px;text-align:center;line-height:1.8}
.post{padding:12px 0;border-bottom:1px solid #e8ddc7}
.post:last-child{border-bottom:none}
.post .meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.post .meta b{color:var(--wood);font-size:13px}
.post .meta .sp{flex:1}
.post .body{font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.post .delrow{display:flex;gap:6px;margin-top:8px}
.post .delrow input{margin-bottom:0;padding:10px;font-size:16px}
.linkbtn{min-height:44px;min-width:44px;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.linkbtn.warn{color:var(--accent)}
.msg{padding:8px 2px;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.msg b{margin-right:6px;color:var(--wood)}
.msg .t{margin-left:6px;color:var(--muted);font-size:11px}
.msg.mine b{color:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 12px}
#fade{position:fixed;inset:0;background:#1b140f;opacity:0;pointer-events:none;transition:opacity .32s;z-index:60}
#fade.on{opacity:1}
#chatlog{position:fixed;left:12px;bottom:78px;display:none;flex-direction:column;justify-content:flex-end;gap:4px;width:min(420px,calc(100vw - 24px));max-height:132px;overflow:hidden;z-index:11;pointer-events:none}
#chatlog.show{display:flex}
#chatlog div{align-self:flex-start;max-width:100%;padding:6px 10px;border-radius:9px;background:rgba(34,25,16,.82);color:#fff4de;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
#chatlog b{color:#f0cf83;margin-right:6px}
#chatlog div.mine b{color:#ffbc9b}
#chatbar{position:fixed;left:12px;bottom:16px;transform:translateY(16px);width:min(540px,calc(100vw - 24px));display:none;gap:8px;z-index:12;opacity:0;transition:opacity .15s,transform .15s}
#chatbar.show{display:flex;opacity:1;transform:translateY(0)}
#chatbar input{min-width:0;min-height:48px;padding:12px;border:1px solid #a08256;border-radius:12px;background:var(--paper);color:var(--ink);font-size:16px;box-shadow:var(--shadow)}
#chatbar #chatnick{flex:0 0 108px}
#chatbar #chatmsg{flex:1}
#chatbar button{flex:none;border:0;border-radius:12px;padding:0 16px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
body:has(#chatbar.show) #hud{visibility:hidden}
.card .help p{margin:0 0 12px;font-size:14px;line-height:1.8}
.card .help kbd{background:#eadcc0;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
#toast{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-140px);max-width:calc(100vw - 24px);padding:12px 18px;border:1px solid #8c6b3e;border-radius:14px;background:#38291c;color:#fff4df;font-size:14px;text-align:center;line-height:1.6;overflow-wrap:anywhere;transition:transform .25s;z-index:30;box-shadow:var(--shadow)}
#toast.show{transform:translate(-50%,0)}
#joy{position:fixed;left:max(22px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,249,236,.2);border:2px solid rgba(255,249,236,.7);display:none;z-index:6;touch-action:none}
#joy i{touch-action:none;position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,249,236,.94);box-shadow:0 4px 12px rgba(0,0,0,.25)}
#act{touch-action:none;position:fixed;right:max(24px,env(safe-area-inset-right));bottom:max(40px,env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;border:3px solid #f9e6bf;background:rgba(184,62,45,.96);color:#fff;font-weight:700;font-size:16px;display:none;z-index:6;box-shadow:var(--shadow)}
body.touch #joy,body.touch #act{display:block}
body.touch #chatlog{bottom:178px;max-height:90px;width:calc(100vw - 24px)}
body.touch #dialog{bottom:max(178px,calc(env(safe-area-inset-bottom) + 160px))}
#yardmenub{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:7;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:10px 16px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
#yardmenub[hidden]{display:none}
body.touch #yardmenub{bottom:max(144px,calc(env(safe-area-inset-bottom) + 128px))}
.yard-places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:20px}
.yard-places .btn{margin:0;font-size:14px;padding:12px 8px}
.wish-list{list-style:none;padding:0;margin:0;font-size:14px;line-height:1.7}
.wish-list li{margin-bottom:8px;padding:12px;border-left:3px solid var(--gold);border-radius:0 10px 10px 0;background:#f4ead5;overflow-wrap:anywhere}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;overflow-y:auto;touch-action:pan-y pinch-zoom;background:radial-gradient(ellipse at 22% 25%,#694425 0,transparent 55%),radial-gradient(ellipse at 85% 85%,#433124 0,transparent 60%),#21180f;color:#fff3d9;z-index:40;transition:opacity .6s}
#title.hide{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .6s,visibility 0s linear .6s}
#title .welcome{display:grid;grid-template-columns:1.1fr 1fr;width:min(920px,100%);margin:auto;flex-shrink:0;border:1px solid #967343;border-radius:26px;overflow:hidden;background:rgba(47,32,20,.78);box-shadow:0 30px 90px rgba(0,0,0,.3)}
#title .welcome-story{padding:44px 36px;align-self:center;text-align:center}
#title .kicker{margin-bottom:12px;color:#e7c77d;font-size:12px;letter-spacing:.22em}
#title h1{font:700 clamp(48px,7vw,76px) 'Gowun Batang',serif;letter-spacing:.06em;margin:0 0 12px;color:#fff4d8}
#title canvas{display:block;max-width:100%;height:auto!important;margin:0 auto 18px}
#title .welcome-copy{margin:0 auto 24px;max-width:360px;font-size:15px;line-height:1.9;color:#f0dec0}
.welcome-steps{display:flex;justify-content:center;gap:0;margin:0;padding:0;list-style:none;color:#e6c789}
.welcome-steps li{padding:0 12px;border-right:1px solid #84633b;font-size:12px;line-height:1.6}
.welcome-steps li:last-child{border:0}
#title .welcome-entry{padding:40px 32px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;justify-content:center}
#title .welcome-entry h2{font:700 25px 'Gowun Batang',serif;margin:0 0 8px}
#title .entry-copy{margin:0 0 24px;color:var(--muted);font-size:13px;line-height:1.7}
#namebox{width:100%;margin:0 0 18px}
#namebox label{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:8px}
#namein{width:100%;min-height:50px;padding:12px 14px;border:1px solid #bca47d;border-radius:11px;background:#fffcf5;color:var(--ink);font-size:16px}
#namein:focus{outline:2px solid var(--gold);outline-offset:2px}
#namein.bad{border-color:var(--accent);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#sexbox{display:flex;gap:8px;margin-top:12px}
#title .sexbtn{flex:1;min-height:46px;padding:10px;border:1px solid #cbb895;border-radius:11px;background:#fffcf5;color:var(--ink);font-size:14px;font-weight:700}
#title .sexbtn.sel{border-color:var(--accent);background:#f8e5d5;color:#8c3023;box-shadow:inset 0 0 0 1px var(--accent)}
#title .sexbtn.bad{border-color:var(--accent);animation:shake .3s}
#namehint{margin-top:10px;font-size:12px;color:var(--muted);min-height:1.2em;line-height:1.6}
#namehint.bad{color:#a43125}
#title #startb{width:100%;min-height:52px;border:0;border-radius:12px;padding:14px 20px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;box-shadow:0 5px 14px rgba(184,62,45,.16)}
#title #startb:hover{background:#a73425}
#title .ctl{margin-top:18px;text-align:center;font-size:11px;line-height:1.8;color:var(--muted)}
@media(max-width:680px){
  #title{padding:16px;max-height:var(--visible-height,100dvh)}
  #title .welcome{max-width:440px;grid-template-columns:1fr;border-radius:22px}
  #title .welcome-story{padding:20px 20px 18px}
  #title h1{font-size:46px;line-height:1.2;margin-bottom:6px}
  #title canvas{width:220px!important;margin-bottom:8px}
  #title .welcome-copy{font-size:13px;line-height:1.7;margin-bottom:0}
  #title .kicker{font-size:11px;line-height:1.3;margin-bottom:8px}
  .welcome-steps{display:none}
  #title .welcome-entry{padding:22px 24px}
  #title .welcome-entry h2{font-size:23px}
  #title .entry-copy{font-size:12px;margin-bottom:14px}
  #namebox{margin-bottom:14px}
  #namebox label{margin-bottom:6px}
  #namein{min-height:46px}
  #sexbox{margin-top:10px}
  #title .sexbtn{min-height:44px}
  #namehint{margin-top:8px}
  #title #startb{min-height:48px}
  #title .ctl{margin-top:12px}
  #hud{width:206px;font-size:12px;padding:10px 12px}
  #hud h3{font-size:15px}
  .card{padding:24px 18px 20px;border-radius:18px}
  .card h2{font-size:23px}
}
@media(max-width:520px){
  #chatbar{bottom:auto;top:max(112px,calc(env(safe-area-inset-top) + 100px));gap:6px}
  #chatbar #chatnick{flex-basis:72px}
  #chatbar button{padding:0 12px}
}
@media(max-width:420px){
  #hud{width:calc(100vw - 178px)}
  #hud h3{font-size:12px;gap:4px}
  #hud h3 small{font-size:10px;padding:4px 5px}
  #hud li{padding:6px 4px;gap:4px}
  .opts{grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
  .opt{font-size:12px}
  #title .welcome-entry{padding:22px 20px}
}
@media(pointer:coarse){#modal{align-items:flex-start;padding-top:max(12px,env(safe-area-inset-top))}}
@media(max-height:560px){
  #title{padding:12px}
  #title canvas{display:none}
  #title .welcome-story{padding:20px}
  #title .welcome-entry{padding:22px}
  #title .welcome-copy{margin-bottom:16px}
  #title .ctl{margin-top:12px}
  #dialog{bottom:16px;padding:20px 18px 28px}
  body.touch #dialog{bottom:20px;z-index:14}
  body.touch #yardmenub{bottom:auto;top:68px}
  body.touch #chatlog{display:none}
}
@media(max-height:560px) and (min-width:560px){#title .welcome{max-width:840px;grid-template-columns:1fr 1.1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
#title .tour-link{width:100%;cursor:pointer;font-family:'Noto Sans KR',sans-serif;box-shadow:none}
.tour-link{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:#f2e7d2;text-decoration:none;font-size:13px;font-weight:700}
.tour-link span{font-size:10px;color:var(--muted);font-weight:400}
.tour-link:hover{background:#e8d8b8}
#title .sexbtn{display:flex;align-items:center;justify-content:center;gap:10px}
#title .sexbtn canvas{display:block!important;flex:none;width:24px!important;height:36px!important;max-width:none;margin:0;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="등불사장 마당. 방향키 또는 WASD로 이동하고 Space로 작업합니다.">등불사장 마당은 캔버스를 지원하는 브라우저에서 이용할 수 있습니다.</canvas>

<div id="hud"><h3 id="hudh" role="button" tabindex="0" aria-expanded="true" aria-controls="quest hudfoot">오늘의 소임 <small>접기</small></h3><ol id="quest"></ol><div class="foot" id="hudfoot"></div><div class="here" id="here"></div></div>
<div id="topbtns"><button class="iconbtn" id="chatb" aria-label="한 줄 이야기 열기" title="한 줄 이야기 (Enter)">💬</button><button class="iconbtn" id="snd" aria-label="소리 끄기" aria-pressed="false" title="소리">🔊</button><button class="iconbtn" id="helpb" aria-label="도움말 열기" title="도움말">?</button></div>
<div id="dialog" role="button" tabindex="0" aria-label="대화 계속하기" aria-describedby="dname dtext"><div class="name" id="dname"></div><div class="text" id="dtext" aria-live="polite"></div><div class="next">▼ 계속</div></div>
<div id="modal"><div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="fade" aria-hidden="true"></div>
<div id="chatlog"></div>
<div id="chatbar">
  <input id="chatnick" aria-label="대화 닉네임" type="text" maxlength="12" placeholder="닉네임" autocomplete="off">
  <input id="chatmsg" aria-label="한 줄 이야기" type="text" maxlength="200" placeholder="한 줄 쓰고 엔터" autocomplete="off">
  <button id="chatsend">보내기</button>
</div>
<div id="joy"><i></i></div>
<button id="act">작업</button>
<button id="yardmenub" hidden aria-haspopup="dialog">마당 메뉴</button>

<div id="title">
  <div class="welcome">
    <section class="welcome-story" aria-labelledby="welcome-title">
      <div class="kicker">한마음선원 청년회</div>
      <h1 id="welcome-title">등불사장</h1>
      <canvas id="tcv" width="320" height="110" aria-hidden="true"></canvas>
      <p class="welcome-copy">손끝으로 엮은 작은 등 하나.<br>소원을 담아, 함께 마당을 밝혀요.</p>
      <ul class="welcome-steps" aria-label="등불사장에서 할 일">
        <li>나만의 등 만들기</li>
        <li>소원 담기</li>
        <li>함께 점등하기</li>
      </ul>
    </section>
    <section class="welcome-entry" aria-labelledby="entry-title">
      <h2 id="entry-title">마당에 들어가기</h2>
      <p class="entry-copy">이름과 모습을 고르고 함께해요.</p>
      <div id="namebox">
        <label for="namein">마당에서 쓸 이름</label>
        <input id="namein" aria-describedby="namehint" type="text" maxlength="12" placeholder="이름을 적어 주세요" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div id="sexbox" role="group" aria-label="캐릭터 모습 선택">
          <button type="button" class="sexbtn" id="sexm" aria-pressed="false"><canvas id="sex-preview-m" width="48" height="72" aria-hidden="true"></canvas><span>남</span></button>
          <button type="button" class="sexbtn" id="sexf" aria-pressed="false"><canvas id="sex-preview-f" width="48" height="72" aria-hidden="true"></canvas><span>여</span></button>
        </div>
        <div id="namehint" aria-live="polite">법우들에게 이 이름과 모습으로 보여요</div>
      </div>
      <button id="startb">마당에 들어가기</button>
      <button type="button" class="tour-link" id="tourb">안양 본원 도량부터 둘러보기</button>
      <div class="ctl" id="ctlhint">이동 방향키 · WASD &nbsp;|&nbsp; 작업 Space<br>이야기 Enter · 마당 메뉴로 바로 작업하기</div>
    </section>
  </div>
</div>

<script type="module" src="/src/deungbul/game.js"></script>
</body>
</html>
